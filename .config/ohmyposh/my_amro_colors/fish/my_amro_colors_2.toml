"$schema"                 = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
async                     = true
enable_cursor_positioning = true
final_space               = true
shell_integration         = true
streaming                 = 200
version                   = 4

[transient_prompt]
    background = 'transparent'
    foreground = '#6A7FEA'
    template   = '[#]  '

[[blocks]]
    alignment = 'left'
    type      = 'prompt'

    [[blocks.segments]]
        foreground = '#B4BEFE'
        style      = 'plain'
        template   = ' {{ .UserName }} on'
        type       = 'session'

    [[blocks.segments]]
        foreground = '#6A7FEA'
        style      = 'plain'
        template   = '  {{ .Path }} '
        type       = 'path'

    [[blocks.segments]]
        foreground       = '#14A5AE'
        powerline_symbol = ''
        style            = 'plain'
        template         = '{{ .UpstreamIcon }} {{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{end}}{{ if gt .Behind 0}}↓{{end}}{{ if gt .Ahead 0 }}↑{{end}}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
        type             = 'git'

        [blocks.segments.properties]
            branch_icon         = ''
            commit_icon         = '@'
            fetch_stash_count   = true
            fetch_status        = true
            fetch_upstream_icon = true

    [[blocks.segments]]
        foreground = '#D0679D'
        style      = 'plain'
        template   = '(  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} ){{ end }}{{ end }}'
        type       = 'python'

[[blocks]]
    alignment = 'right'
    type      = 'prompt'

    [[blocks.segments]]
        foreground = '#B8C4C7'
        style      = 'plain'
        template   = '{{ .CurrentDate | date "15:04:05" }}'
        type       = 'time'

    [[blocks.segments]]
        foreground = '#6A7FEA'
        style      = 'plain'
        template   = ' {{.Icon}} '
        type       = 'os'

[[blocks]]
    alignment = 'left'
    newline   = true
    type      = 'prompt'

    [[blocks.segments]]
        foreground = '#cd5e42'
        style      = 'plain'
        template   = ' '
        type       = 'root'

    [[blocks.segments]]
        foreground = '#6A7FEA'
        style      = 'plain'
        template   = '['
        type       = 'text'

    [[blocks.segments]]
        foreground = '#50C878'
        style      = 'plain'
        template   = '   '
        type       = 'python'

    [[blocks.segments]]
        foreground = '#7FD5EA'
        style      = 'plain'
        template   = '  '
        type       = 'go'

    [[blocks.segments]]
        foreground = '#342311'
        style      = 'plain'
