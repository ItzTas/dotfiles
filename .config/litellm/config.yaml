# LiteLLM proxy config — DeepSeek via gateway (Claude Code gateway discovery)
#
# model_name usa prefixo "anthropic/" de propósito: o Claude Code só mostra no
# /model picker IDs que começam com claude/anthropic. O LiteLLM roteia o
# provider real (deepseek) pelo litellm_params.
#
# Claude real (assinatura claude.ai) NÃO passa por aqui — roda direto via
# `claude` (OAuth próprio).

model_list:
  - model_name: anthropic/deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: anthropic/deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
